services:
  # 1. REACT FRONTEND
  frontend:
    build:
      context: ./frontend
    restart: always

  # 2. PYTHON BACKEND
  # 2. PYTHON BACKEND
  backend:
    build:
      context: ./backend
    restart: always
    # CRITICAL: This tricks your hardcoded python file into sending "localhost" calls to the Redis container
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      redis:
        condition: service_healthy

  # 3. REDIS STACK
  redis:
    image: redis/redis-stack:latest
    restart: always
    command: ["redis-server", "--port", "6381", "--protected-mode", "no"]
    ports:
      - "6381:6381" # Exposes 6381 to the host-gateway loopback
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6381", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 4. GOTENBERG PDF ENGINE
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: always
    ports:
      - "3003:3000"

  # 5. NGINX REVERSE PROXY
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    restart: always
    depends_on:
      - frontend
      - backend
    entrypoint: >
      sh -c "echo '
      server {
          listen 80;
          
          # Routes /api web traffic cleanly back to the standard backend service
          location /api {
              proxy_pass http://backend:8000;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          }

          location / {
              proxy_pass http://frontend:4173;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_intercept_errors on;
              error_page 404 =200 /index.html;
          }
      }' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"

volumes:
  redis-data: