services:
  # 1. REACT FRONTEND
  frontend:
    frontend:
    build:
      context: .                   # CRITICAL: Shifts context to project root so turbo can see all folders
      dockerfile: ./frontend/Dockerfile # Points directly to your frontend Dockerfile
      args:
        - VITE_APP_BACKEND_URI=${VITE_APP_BACKEND_URI}
    restart: always

  # 2. PYTHON BACKEND
  # 2. PYTHON BACKEND
  backend:
    build:
      context: ./backend
    restart: always
    # CRITICAL: This tricks your hardcoded python file into sending "localhost" calls to the Redis container
    extra_hosts:
      - "localhost:host-gateway"
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN}
      - DB_NAME=${DB_NAME}
      - JWT_AUTH_SECRET=${JWT_AUTH_SECRET}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      redis:
        condition: service_healthy

  # 3. REDIS STACK
  redis:
    image: redis/redis-stack:latest
    restart: always
    command: ["redis-server", "--port", "6381", "--protected-mode", "no"]
    ports:
      - "6381:6381" # Exposes 6381 to the host-gateway loopback
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6381", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 4. GOTENBERG PDF ENGINE
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: always
    ports:
      - "3003:3000"

  # 5. NGINX REVERSE PROXY
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    restart: always
    depends_on:
      - frontend
      - backend
    entrypoint: >
      sh -c "echo '
      server {
          listen 80;
          
          # FIX: Captures both /api and anything nested like /api/v1/profile
          location /api {
              proxy_pass http://backend:8000/api/;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
          }

          location / {
              proxy_pass http://frontend:4173;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_intercept_errors on;
              error_page 404 =200 /index.html;
          }
      }' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"

volumes:
  redis-data: