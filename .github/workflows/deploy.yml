name: Deploy Fullstack App to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Expand the operating system partitions to claim all available storage
            # This handles standard t2 block layouts dynamically
            sudo growpart /dev/xvda 1 || sudo growpart /dev/nvme0n1 1 || true
            sudo resize2fs /dev/xvda1 || sudo resize2fs /dev/nvme0n1p1 || true
            
            # 2. Base64 Decoder layer to securely target your repository
            B64_URL="aHR0cHM6Ly9naXRodWIuY29tL2NlamF5dGhha2thci9wcm9maWxlX2Zhcm1fc3RhY2suZ2l0"
            REAL_URL=$(echo "$B64_URL" | base64 --decode)

            if [ ! -d "profile_farm_stack" ]; then
              git clone "$REAL_URL" profile_farm_stack
            fi
            
            cd profile_farm_stack
            git reset --hard origin/main
            git pull "$REAL_URL" main

            # 3. Write secrets cleanly into the .env file
            cat << 'EOF' > .env
            MONGO_URI=${{ secrets.MONGO_URI }}
            ALLOWED_ORIGIN=${{ secrets.ALLOWED_ORIGIN }}
            DB_NAME=${{ secrets.DB_NAME }}
            REDIS_HOST=${{ secrets.REDIS_HOST }}
            JWT_AUTH_SECRET=${{ secrets.JWT_AUTH_SECRET }}
            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            VITE_APP_BACKEND_URI=${{ secrets.VITE_APP_BACKEND_URI }}
            EOF

            # 4. Aggressively purge corrupted or dangling build cache layers
            docker compose down --remove-orphans || true
            docker system prune -a --volumes -f
            docker builder prune -a -f

            # 5. Compile and deploy the application
            docker compose up --build --force-recreate -d
