name: Deploy Fullstack App to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Authenticate with AWS directly on the GitHub cloud runner
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 2. Automatically find and resize your EC2 volume to 30 GB via AWS CLI
      - name: Expand AWS Volume Storage Size to 30GB
        run: |
          # Fetch the unique Root Volume ID attached to your EC2 IP
          VOLUME_ID=$(aws ec2 describe-instances \
            --filters "Name=ip-address,Values=${{ secrets.EC2_HOST }}" \
            --query "Reservations[*].Instances[*].BlockDeviceMappings[0].Ebs.VolumeId" \
            --output text)
          
          echo "Target Volume Detected: $VOLUME_ID"
          
          # Force the volume size to upscale directly to 30 GB
          aws ec2 modify-volume --volume-id $VOLUME_ID --size 30 || true

      # 3. Connect to your instance over SSH to finalize the setup
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Expand the Linux partition maps to swallow the newly added space
            # On modern AWS NVMe t2 instances, the root disk mapping is /dev/nvme0n1 or /dev/xvda
            sudo growpart /dev/xvda 1 || sudo growpart /dev/nvme0n1 1 || true
            sudo resize2fs /dev/xvda1 || sudo resize2fs /dev/nvme0n1p1 || true
            
            # Base64 Decoder layer to securely target your repository
            B64_URL="aHR0cHM6Ly9naXRodWIuY29tL2NlamF5dGhha2thci9wcm9maWxlX2Zhcm1fc3RhY2suZ2l0"
            REAL_URL=$(echo "$B64_URL" | base64 --decode)

            if [ ! -d "profile_farm_stack" ]; then
              git clone "$REAL_URL" profile_farm_stack
            fi
            
            cd profile_farm_stack
            git reset --hard origin/main
            git pull "$REAL_URL" main

            # Write secrets cleanly into the .env file
            cat << 'EOF' > .env
            MONGO_URI=${{ secrets.MONGO_URI }}
            ALLOWED_ORIGIN=${{ secrets.ALLOWED_ORIGIN }}
            DB_NAME=${{ secrets.DB_NAME }}
            REDIS_HOST=${{ secrets.REDIS_HOST }}
            JWT_AUTH_SECRET=${{ secrets.JWT_AUTH_SECRET }}
            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            VITE_APP_BACKEND_URI=${{ secrets.VITE_APP_BACKEND_URI }}
            EOF

            # Wipe out corrupted build cache layers to free up everything
            docker compose down --remove-orphans || true
            docker system prune -a --volumes -f
            docker builder prune -a -f

            # Build and deploy the application
            docker compose up --build --force-recreate -d
