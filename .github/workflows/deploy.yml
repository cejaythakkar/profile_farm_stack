name: Deploy Fullstack App to AWS EC2

on:
  push:
    branches:
      - main # Triggers the deployment whenever you push to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. We read the repository via the clean $GITHUB_REPOSITORY system flag
            if [ ! -d "my-project" ]; then
              git clone "https://github.com{GITHUB_REPOSITORY}.git" my-project
            fi
            
            cd my-project
            
            git reset --hard origin/main
            git pull origin main

            # 2. Write your secrets directly using specialized EOF to prevent quote stripping
            cat << 'EOF' > .env
            MONGO_URI=${{ secrets.MONGO_URI }}
            ALLOWED_ORIGIN=${{ secrets.ALLOWED_ORIGIN }}
            DB_NAME=${{ secrets.DB_NAME }}
            REDIS_HOST=${{ secrets.REDIS_HOST }}
            JWT_AUTH_SECRET=${{ secrets.JWT_AUTH_SECRET }}
            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            VITE_APP_BACKEND_URI=${{ secrets.VITE_APP_BACKEND_URI }}
            EOF

            # 3. Clean and launch the entire stack
            docker compose down --remove-orphans
            docker image prune -f
            docker compose up --build --force-recreate -d