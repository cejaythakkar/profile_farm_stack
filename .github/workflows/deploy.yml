name: Deploy Fullstack App to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            B64_URL="aHR0cHM6Ly9naXRodWIuY29tL2NlamF5dGhha2thci9wcm9maWxlX2Zhcm1fc3RhY2suZ2l0"
            REAL_URL=$(echo "$B64_URL" | base64 --decode)

            if [ ! -d "profile_farm_stack" ]; then
              git clone "$REAL_URL" profile_farm_stack
            fi
            
            cd profile_farm_stack
            git reset --hard origin/main
            git pull "$REAL_URL" main

            # Write secrets cleanly to your host environment file
            cat << 'EOF' > .env
            MONGO_URI=${{ secrets.MONGO_URI }}
            ALLOWED_ORIGIN=${{ secrets.ALLOWED_ORIGIN }}
            DB_NAME=${{ secrets.DB_NAME }}
            REDIS_HOST=${{ secrets.REDIS_HOST }}
            JWT_AUTH_SECRET=${{ secrets.JWT_AUTH_SECRET }}
            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            VITE_APP_BACKEND_URI=${{ secrets.VITE_APP_BACKEND_URI }}
            EOF

            # Wipe old container states and build the stack fresh
            docker compose down --remove-orphans || true
            docker system prune -f
            docker compose up --build --force-recreate -d
